services:
  - type: web
    name: chatrio
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --omit=dev && npm ci --prefix frontend && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
